# DesktopCal 중계 — 10분마다 공공데이터를 받아 gh-pages 가지에 올린다 (GitHub Pages 가 공개 주소로).
# 중계 저장소에서는 .github/workflows/relay.yml 로 둔다. 키는 저장소 Settings → Secrets and variables → Actions.
name: relay

on:
  schedule:
    - cron: '4,14,24,34,44,54 * * * *'   # 10분마다 — 정각은 붐벼서 늦게 돈다 (범위/간격 꼴 '4-59/10' 은
                                         #  첫날 한 번도 예약되지 않아 2026-10-10 이 꼴로)
  workflow_dispatch:
  push:
    branches: [main]                     # 중계 코드를 올리면 바로 한 번 (아래 '이어 부르기'도 여기서 시작된다)

permissions:
  contents: write                  # gh-pages 가지에 올리기
  actions: write                   # 예약이 60일 뒤 멈추지 않게 · 예약이 조용할 때 다음 실행 부르기 (아래 두 단계)

concurrency:
  group: relay
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 20                # 받기(최대 5분) + 이어 부르기 전 쉬기(7분)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet requests==2.32.3
      - name: Previous files
        run: git clone --quiet --depth 1 --branch gh-pages "https://github.com/${GITHUB_REPOSITORY}.git" site || mkdir -p site
      - name: Fetch
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          EXIM_KEY: ${{ secrets.EXIM_KEY }}
          KOBIS_KEY: ${{ secrets.KOBIS_KEY }}
        run: python relay.py site
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd site
          rm -rf .git
          git init --quiet --initial-branch gh-pages
          git add --all
          git -c user.name=desktopcal-relay -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
              commit --quiet -m "relay $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --quiet --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
      - name: Keep the schedule alive
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 공개 저장소는 60일 동안 활동이 없으면 예약을 멈춘다 — 하루 한 번 스스로 다시 켠다
          if [ "$(date -u +%H%M)" \< "0010" ]; then
            gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/relay.yml/enable" > /dev/null || true
          fi
      - name: Call the next run while the schedule is silent
        # GitHub 예약 실행은 늦거나 빠질 수 있다 — 새 저장소에서 몇 시간 동안 한 번도 돌지 않았다 (2026-10-10).
        # 손으로·스스로·코드를 올려 시작한 실행은, 최근 30분 안에 예약 실행이 없으면 7분 쉬고 다음 실행을 부른다.
        # 예약이 돌기 시작하면 저절로 멈춘다. GITHUB_TOKEN 으로 부른 workflow_dispatch 는 새 실행을 만든다 (GitHub 문서).
        if: always() && github.event_name != 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/relay.yml/runs?event=schedule&per_page=1" \
                 --jq '.workflow_runs[0].created_at // ""' || true)
          if [ -n "$last" ] && [ $(( $(date +%s) - $(date -d "$last" +%s) )) -lt 1800 ]; then
            echo "schedule is running ($last)"
            exit 0
          fi
          sleep 420
          gh workflow run relay.yml --ref "${GITHUB_REF_NAME}"
